name: Vorpal tests
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install import dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile import scripts
        run: python -m py_compile src/import_dataset.py src/ingest_url.py src/data.py
      - name: Test import pipeline
        run: python -m unittest discover -s tests -p "test_import*.py" -v
